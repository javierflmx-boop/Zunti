<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zunti — Qualify before you drive</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,200;0,300;0,500;1,200;1,300&family=Outfit:wght@200;300;400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #080808;
    --bg-elevated: #141414;
    --card: #1A1A1A;
    --line: rgba(255,255,255,0.06);
    --line-h: rgba(255,255,255,0.14);
    --orange: #E8843A;
    --gold: #E8843A;
    --cream: #F5F0EA;
    --text: #F5F0EA;
    --text-dim: rgba(245,240,234,0.5);
    --text-faint: rgba(245,240,234,0.38);
    --good: #4ADE80;
    --warn: #E8843A;
    --danger: #e05555;
    --radius: 0px;
    --fd: 'Cormorant Garamond', serif;
    --fb: 'Outfit', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background: var(--bg);
    color: var(--text);
    font-family: var(--fb);
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    overflow-x: hidden;
  }
  .display{ font-family: 'Cormorant Garamond', serif; font-weight:600; }
  .mono{ font-family: 'Space Mono', monospace; }

  #app{
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    position: relative;
    display: flex;
    flex-direction: column;
    background: var(--bg);
  }
  #app.landing-page{ max-width: 100%; }

  /* ---------- Public page uses light theme ---------- */
  .public-theme{
    background: var(--cream);
    color: #221E18;
  }
  .public-theme h1, .public-theme h2{ color: #221E18; }
  .public-theme .p-card{
    background: #fff;
    border: 1px solid #E9E0D2;
  }
  .public-theme .p-dim{ color: #8A7F6E; }

  /* ---------- Top bar ---------- */
  .topbar{
    padding: 20px 20px 14px;
    display:flex; align-items:center; justify-content:space-between;
    position: sticky; top:0; z-index: 20;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .public-theme .topbar{ background: var(--cream); border-bottom: 1px solid #E9E0D2; }
  .brand{
    display:flex; align-items:center; gap:9px;
    font-family:'Cormorant Garamond', serif; font-weight:600; font-size:24px; letter-spacing:0.01em;
  }
  .brand .dot{ width:6px; height:6px; border-radius:50%; background:var(--orange); box-shadow: 0 0 10px var(--orange);}
  .topbar-sub{ font-size:11px; color:var(--text-faint); font-family:'Outfit'; letter-spacing:0.04em; }

  main{ flex:1; padding: 18px 18px 100px; }

  /* ---------- Bottom nav ---------- */
  .bottomnav{
    position: sticky; bottom:0; left:0; right:0;
    background: rgba(8,8,8,0.92);
    backdrop-filter: blur(14px);
    border-top: 1px solid var(--line);
    display:flex; justify-content: space-around;
    padding: 10px 8px calc(10px + env(safe-area-inset-bottom));
    z-index: 30;
  }
  .navbtn{
    display:flex; flex-direction:column; align-items:center; gap:6px;
    background:none; border:none; color: var(--text);
    font-family:var(--fb); font-size:0.6rem; font-weight:300; letter-spacing:0.1em; text-transform:uppercase;
    cursor:pointer; padding:6px 10px; border-radius:0;
    transition: opacity .25s ease, color .25s ease;
  }
  .navbtn svg{ width:22px; height:22px; opacity:0.5; transition:opacity .25s ease; }
  .navbtn span{ opacity:0.5; transition:opacity .25s ease; }
  .navbtn.active{ color: var(--orange); }
  .navbtn.active svg, .navbtn.active span{ opacity:1; }

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    font-family:var(--fb); font-weight:300; font-size:0.7rem; letter-spacing:0.2em; text-transform:uppercase;
    border-radius: 0; border:none; cursor:pointer;
    padding: 16px 20px; width:100%;
    transition: all .3s ease;
  }
  .btn svg{ width:16px; height:16px; flex-shrink:0; }
  .btn-primary{ background: var(--cream); color: var(--bg); }
  .btn-primary:hover{ background: var(--orange); }
  .btn-ghost{ background: transparent; color: var(--text); border:1px solid var(--line); }
  .btn-ghost:hover{ border-color: var(--line-h); }
  .btn-outline-light{ background:transparent; color:#221E18; border:1px solid #221E18; }

  input, textarea, select{
    width:100%; background: var(--card); border:1px solid var(--line);
    color: var(--text); border-radius:0; padding:13px 15px;
    font-family:var(--fb); font-weight:300; font-size:0.84rem; outline:none;
    transition: border-color .3s;
  }
  .public-theme input, .public-theme textarea, .public-theme select{
    background:#fff; border:1px solid #E2D8C6; color:#221E18;
  }
  input:focus, textarea:focus, select:focus{ border-color: var(--orange); }
  input::placeholder, textarea::placeholder{ color: var(--text-faint); }
  label{ font-size:0.58rem; font-weight:400; color:var(--orange); display:block; margin-bottom:8px; letter-spacing:0.22em; text-transform:uppercase; }
  .public-theme label{ color:#8A7F6E; }
  .field{ margin-bottom:18px; }

  .card{ background: var(--card); border:1px solid var(--line); border-radius: var(--radius); padding:20px; }

  h1{ font-family:var(--fd); font-weight:300; font-size:2rem; letter-spacing:0.01em; }
  h2{ font-family:var(--fd); font-weight:300; font-size:1.5rem; letter-spacing:0.01em; margin-bottom:4px;}
  .eyebrow{ font-size:0.62rem; font-weight:400; letter-spacing:0.22em; text-transform:uppercase; color:var(--orange); margin-bottom:8px;}
  .muted{ color:var(--text-faint); font-size:0.8rem; line-height:1.7; font-weight:300; }
  .public-theme .muted{ color:#8A7F6E; }

  /* Lead rank card - signature element */
  .lead-row{
    display:flex; align-items:center; gap:16px;
    background:transparent; border:none; border-bottom:1px solid var(--line); border-radius:0;
    padding:16px 2px;
  }
  .rank-badge{
    width:30px; height:30px; border-radius:0; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Mono'; font-weight:700; font-size:13px;
    background: var(--bg-elevated); color: var(--text-faint); border:1px solid var(--line);
  }
  .rank-badge.gold{ background: rgba(255,184,0,0.12); color: var(--gold); border-color: rgba(255,184,0,0.3); }
  .lead-info{ flex:1; min-width:0; }
  .lead-name{ font-weight:700; font-size:15px; }
  .lead-meta{ font-size:12px; color:var(--text-faint); margin-top:2px; }
  .lead-amount{ text-align:right; }
  .lead-amount .num{ font-family:'Space Mono'; font-weight:700; font-size:17px; color: var(--gold); }
  .lead-amount .lbl{ font-size:10px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.06em;}

  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px; }
  .stat-card{ background:transparent; border:none; border-bottom:1px solid var(--line); border-radius:0; padding:16px 4px; }
  .stat-num{ font-family:'Space Mono'; font-weight:700; font-size:22px; color:var(--orange); }
  .stat-lbl{ font-size:11.5px; color:var(--text-dim); margin-top:2px; }

  .prop-card{
    background:transparent; border:none; border-bottom:1px solid var(--line); border-radius:0; overflow:hidden; margin-bottom:0; padding-bottom:18px; margin-top:18px;
  }
  .prop-img{ height:120px; background: linear-gradient(135deg, #2A241B, #14120F); display:flex; align-items:center; justify-content:center; color:var(--text-faint); font-size:12px;}
  .prop-body{ padding:14px 16px; }
  .prop-price{ font-family:'Space Mono'; font-weight:700; color:var(--gold); font-size:16px; }

  .public-prop-card{
    background:transparent; border:none; border-bottom:1px solid #E2D8C6; border-radius:0; overflow:hidden; margin-bottom:0; padding-bottom:22px; margin-top:22px;
    cursor:pointer;
  }
  .public-prop-img{ height:150px; background: linear-gradient(135deg, #EDE3D0, #F7F1E8); display:flex; align-items:center; justify-content:center; color:#B8AA92; font-size:12px;}

  .badge{ display:inline-block; padding:4px 10px; border-radius:100px; font-size:11px; font-weight:700; }
  .badge-orange{ background: rgba(255,107,0,0.14); color: var(--orange); }

  .empty{ text-align:center; padding: 50px 20px; color:var(--text-faint); }
  .empty svg{ opacity:0.35; margin-bottom:14px; }

  .fab{
    position: fixed; bottom: 90px; right: 50%; transform: translateX(200px);
    width:52px; height:52px; border-radius:50%; background:var(--orange);
    display:flex; align-items:center; justify-content:center; border:none; cursor:pointer;
    box-shadow: 0 8px 24px rgba(255,107,0,0.4); z-index:25;
  }
  @media (max-width: 560px){ .fab{ right:20px; transform:none; } }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.5);
    display:flex; align-items:flex-end; z-index:50;
  }
  .modal{
    background: rgba(10,10,10,0.97); backdrop-filter: blur(20px); width:100%; max-width:520px; margin:0 auto;
    border-radius: 0; padding: 32px 24px calc(40px + env(safe-area-inset-bottom));
    max-height: 88vh; overflow-y:auto;
    border-top: 1px solid var(--line);
  }
  .public-theme.modal, .modal.public-modal{ background:#fff; }
  .modal-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; }
  .modal-close{ background:none; border:none; cursor:pointer; color:var(--text-faint); font-size:1.1rem; padding:4px; transition:color .3s; line-height:1; }
  .modal-close:hover{ color:var(--text); }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background: var(--card); border:1px solid var(--line); color:var(--text);
    font-family:var(--fb); font-weight:300; font-size:0.75rem; letter-spacing:0.1em;
    padding:12px 24px; border-radius:0; z-index:100; white-space:nowrap;
    animation: toastIn .3s ease;
  }
  @keyframes toastIn{ from{opacity:0; transform:translate(-50%,20px);} to{opacity:1; transform:translate(-50%,0);} }

  .link-box{
    display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line);
    border-radius:14px; padding:14px 16px; margin-bottom:14px;
  }
  .link-box .mono{ flex:1; font-size:13px; color:var(--gold); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .copy-btn{ background:var(--orange); color:#0F0E0C; border:none; border-radius:2px; padding:9px 16px; font-weight:500; font-size:11px; letter-spacing:0.05em; text-transform:uppercase; cursor:pointer; flex-shrink:0; font-family:'Outfit'; }

  .progress-track{ height:6px; background:var(--line); border-radius:10px; overflow:hidden; margin-top:8px; }
  .progress-fill{ height:100%; background: linear-gradient(90deg, var(--orange), var(--gold)); border-radius:10px; }

  .segmented{ display:flex; gap:6px; background:var(--bg-elevated); border-radius:12px; padding:4px; margin-bottom:16px; }
  .public-theme .segmented{ background:#EFE6D5; }
  .seg-btn{ flex:1; border:none; background:none; padding:9px; border-radius:9px; font-size:12.5px; font-weight:700; color:var(--text-faint); cursor:pointer; }
  .seg-btn.active{ background:var(--orange); color:#14120F; }

  .hero-public{ text-align:center; padding: 26px 8px 4px; }
  .avatar-circle{
    width:44px; height:44px; border-radius:50%; border:1px solid var(--orange);
    display:flex; align-items:center; justify-content:center; margin:0 auto 16px;
    font-family:'Cormorant Garamond', serif; font-weight:600; font-size:18px; color:var(--orange);
  }

  /* House hero band - dissolves into the black background at the top */
  .house-hero{
    position:relative; width:calc(100% + 36px); height:200px; overflow:hidden;
    margin: -18px -18px 4px;
    background: var(--bg-elevated);
    display:flex; align-items:flex-end; justify-content:center;
  }
  .public-theme .house-hero{ background: #EFE6D5; }
  .house-hero-art{
    width:100%; height:100%; display:flex; align-items:flex-end; justify-content:center;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.5) 30%, black 62%);
    mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.5) 30%, black 62%);
  }
  .house-hero svg{ width:280px; height:auto; opacity:0.95; }
  .house-hero .house-glow{ filter: drop-shadow(0 0 14px rgba(255,106,31,0.3)); }
  .house-hero-caption{
    position:absolute; top:20px; left:0; right:0; text-align:center; z-index:2;
    font-family:'Space Mono'; font-size:9.5px; letter-spacing:0.22em; text-transform:uppercase; color:var(--text-faint);
  }
  .public-theme .house-hero-caption{ color:#B0A489; }

  /* ---------- Landing page (matches Maeso spec exactly) ---------- */
  .landing-topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding: 22px 40px; border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:20; background:rgba(8,8,8,0.9); backdrop-filter: blur(12px);
    gap:14px;
  }
  .landing-logo{
    font-family:var(--fb); font-weight:200; font-size:1rem; letter-spacing:0.35em;
    color:var(--text); text-transform:uppercase; cursor:pointer;
  }
  .landing-nav{ display:flex; align-items:center; gap:12px; }
  .nav-btn-outline{
    border:1px solid var(--line); background:none; color:var(--text-faint);
    font-family:var(--fb); font-size:0.65rem; letter-spacing:0.2em; text-transform:uppercase;
    padding:8px 18px; cursor:pointer; white-space:nowrap; transition: all .25s;
  }
  .nav-btn-outline:hover{ border-color:var(--line-h); color:var(--text); }
  .nav-btn-solid{
    border:1px solid var(--cream); background:var(--cream); color:var(--bg);
    font-family:var(--fb); font-size:0.65rem; letter-spacing:0.2em; text-transform:uppercase;
    padding:8px 18px; cursor:pointer; white-space:nowrap; transition: all .25s;
  }
  .nav-btn-solid:hover{ background:var(--orange); border-color:var(--orange); }

  .landing-hero{
    position:relative; width:100%; overflow:hidden;
    display:flex; flex-direction:column; align-items:center;
    text-align:center; padding: 56px 24px 44px; background: var(--bg);
  }
  .hero-house-band{
    position:relative; width:100%; max-width:1100px;
    height: clamp(140px, 18vw, 230px);
    margin-bottom: 28px;
  }
  .hero-house{ position:absolute; bottom:0; }
  .hero-house svg{ display:block; width:100%; height:auto; }
  .hero-house.h1{ left:2%; width:clamp(80px,10vw,150px); }
  .hero-house.h2{ left:40%; width:clamp(95px,11.5vw,180px); }
  .hero-house.h3{ left:78%; width:clamp(100px,13vw,200px); }
  @media (max-width:560px){
    .hero-house-band{ height:clamp(110px,32vw,160px); margin-bottom:18px; }
    .hero-house.h1{ left:-2%; width:clamp(65px,24vw,95px); }
    .hero-house.h2{ left:36%; width:clamp(75px,27vw,115px); }
    .hero-house.h3{ left:72%; width:clamp(80px,29vw,125px); }
  }
  .landing-wordmark{
    position:relative; z-index:2;
    font-family:var(--fb); font-weight:200; text-transform:uppercase;
    font-size: clamp(4rem, 16vw, 12rem); letter-spacing:0.15em; color:var(--cream); line-height:1;
    margin-bottom:16px; user-select:none;
  }
  .landing-tagline{
    position:relative; z-index:2; margin-bottom:36px;
    font-family:var(--fb); font-weight:300; font-size:clamp(0.6rem,1.2vw,0.75rem); letter-spacing:0.5em; text-transform:uppercase; color:var(--text-faint);
  }

  .tile-grid{
    position:relative; z-index:2;
    display:flex; justify-content:center; gap:2px; flex-wrap:wrap; padding:0 24px;
  }
  .tile{
    display:flex; flex-direction:column; align-items:center; gap:12px;
    padding:20px 24px; border:1px solid var(--line);
    background:rgba(8,8,8,0.6); backdrop-filter: blur(12px);
    cursor:pointer; transition: all .25s; min-width:96px;
  }
  .tile:hover{ border-color:var(--line-h); background:rgba(20,20,20,0.8); }
  .tile:active{ background: var(--bg-elevated); }
  .tile svg{ width:28px; height:28px; color:var(--text); opacity:0.5; transition: opacity .25s, color .25s; }
  .tile:hover svg{ opacity:1; }
  .tile-label{
    font-family:var(--fb); font-weight:300; font-size:0.7rem; letter-spacing:0.2em; text-transform:uppercase; color:var(--text-faint); transition: color .25s;
  }
  .tile:hover .tile-label{ color:var(--text); }
  @media (max-width:600px){
    .landing-topbar{ padding:16px 20px; }
    .tile{ padding:14px 12px; min-width:60px; }
    .tile svg{ width:22px; height:22px; }
    .tile-label{ font-size:0.6rem; }
  }
</style>
</head>

<body>
<div id="app"></div>

<script>
// ---------------- Supabase ----------------
// TODO: paste your project's values here after creating the Supabase project (step 1 in chat)
const SUPA_URL = 'https://delxvzkrigsfkfycwflg.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRlbHh2emtyaWdzZmtmeWN3ZmxnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5OTc4NjYsImV4cCI6MjEwMDU3Mzg2Nn0.e7Kzbny-hKuJaonaU96lw25M_qksMTfVO98MSPeB0E4';
const { createClient } = supabase;
const db = createClient(SUPA_URL, SUPA_KEY);

// ---------------- App state ----------------
let state = {
  currentUser: null,  // supabase auth user
  route: 'loading',
  profile: null,
  properties: [],
  leads: [],
  publicSlug: null,
  publicProperties: [],
  publicProfile: null,
  selectedProperty: null,
};

function slugify(s){
  return s.toLowerCase().trim().replace(/[^a-z0-9]+/g,'').slice(0,20) || 'user'+Math.floor(Math.random()*9999);
}
function fmtMoney(n){
  n = Number(n)||0;
  return '$' + n.toLocaleString('en-US');
}
function timeAgo(ts){
  const diff = Date.now() - new Date(ts).getTime();
  const mins = Math.floor(diff/60000);
  if(mins < 1) return 'just now';
  if(mins < 60) return mins+'m ago';
  const hrs = Math.floor(mins/60);
  if(hrs < 24) return hrs+'h ago';
  return Math.floor(hrs/24)+'d ago';
}

// ---------------- Routing ----------------
function parseHash(){
  const h = location.hash.replace('#','') || '/dashboard';
  const parts = h.split('/').filter(Boolean);
  return parts;
}

async function route(){
  const parts = parseHash();
  if(parts[0] === 'p' && parts[1]){
    state.route = 'public';
    state.publicSlug = parts[1];
    await loadPublic(parts[1]);
    render();
    return;
  }
  if(!state.currentUser){
    state.route = 'onboard';
    render();
    return;
  }
  await loadPrivate();
  if(!state.profile){
    state.route = 'complete-profile';
    render();
    return;
  }
  state.route = parts[0] || 'dashboard';
  render();
}

async function loadPrivate(){
  if(!state.currentUser) return;
  const { data: profile } = await db.from('profiles').select('*').eq('id', state.currentUser.id).maybeSingle();
  state.profile = profile;
  if(!profile) return;
  const { data: properties } = await db.from('properties').select('*').eq('profile_id', state.currentUser.id).order('created_at', { ascending: false });
  state.properties = properties || [];
  const { data: leads } = await db.from('leads').select('*').eq('profile_id', state.currentUser.id).order('down_payment', { ascending: false });
  state.leads = leads || [];
}

async function loadPublic(slug){
  const { data: profile } = await db.from('profiles').select('*').eq('slug', slug).single();
  state.publicProfile = profile;
  if(profile){
    const { data: properties } = await db.from('properties').select('*').eq('profile_id', profile.id).order('created_at', { ascending: false });
    state.publicProperties = properties || [];
  } else {
    state.publicProperties = [];
  }
}

// ---------------- Init ----------------
db.auth.onAuthStateChange(async (event, session) => {
  state.currentUser = session?.user || null;
  if(state.route !== 'loading') await route();
});

async function init(){
  const { data: { session } } = await db.auth.getSession();
  state.currentUser = session?.user || null;
  window.addEventListener('hashchange', route);
  await route();
}

// ---------------- Actions ----------------
async function createProfile(businessName, phone, email, password){
  let slug = slugify(businessName);
  const { data: existing } = await db.from('profiles').select('slug').eq('slug', slug).maybeSingle();
  if(existing) slug = slug + Math.floor(Math.random()*90+10);

  const { data, error } = await db.auth.signUp({ email, password });
  if(error){ showToast(error.message); return; }
  if(!data.user){ showToast('Check your email to confirm your account'); return; }

  const { error: profErr } = await db.from('profiles').insert({
    id: data.user.id, slug, business_name: businessName, phone, email
  });
  if(profErr){ showToast(profErr.message); return; }

  state.currentUser = data.user;
  location.hash = '#/dashboard';
  await route();
}

async function completeProfile(businessName, phone){
  let slug = slugify(businessName);
  const { data: existing } = await db.from('profiles').select('slug').eq('slug', slug).maybeSingle();
  if(existing) slug = slug + Math.floor(Math.random()*90+10);

  const { error } = await db.from('profiles').insert({
    id: state.currentUser.id, slug, business_name: businessName, phone, email: state.currentUser.email
  });
  if(error){ showToast(error.message); return; }
  location.hash = '#/dashboard';
  await route();
}

async function loginExisting(email, password){
  const { data, error } = await db.auth.signInWithPassword({ email, password });
  if(error){ showToast(error.message); return; }
  state.currentUser = data.user;
  location.hash = '#/dashboard';
  await route();
}

async function logout(){
  await db.auth.signOut();
  state.currentUser = null;
  state.profile = null;
  location.hash = '#/dashboard';
  await route();
}

async function addProperty(data){
  const { error } = await db.from('properties').insert({
    profile_id: state.currentUser.id,
    title: data.title, address: data.address, price: data.price, beds: data.beds
  });
  if(error){ showToast(error.message); return; }
  await loadPrivate();
  render();
  showToast('Property added');
}

async function deleteProperty(id){
  await db.from('properties').delete().eq('id', id);
  state.properties = state.properties.filter(p=>p.id!==id);
  render();
}

async function submitLead(profileId, data){
  const { error } = await db.from('leads').insert({
    profile_id: profileId, name: data.name, phone: data.phone, email: data.email,
    down_payment: data.downPayment, budget: data.budget, household_size: data.householdSize,
    move_date: data.moveDate, property_title: data.propertyTitle, status: 'new'
  });
  if(error){ showToast('Something went wrong — try again'); return false; }
  return true;
}

async function updateLeadStatus(id, status){
  await db.from('leads').update({ status }).eq('id', id);
  state.leads = state.leads.map(l => l.id===id ? {...l, status} : l);
  render();
}

let toastTimer;
function showToast(msg){
  let t = document.getElementById('toast');
  if(t) t.remove();
  t = document.createElement('div');
  t.id='toast'; t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.remove(), 2200);
}

function copyLink(){
  const link = location.origin + location.pathname + '#/p/' + state.profile?.slug;
  navigator.clipboard?.writeText(link).catch(()=>{});
  showToast('Link copied — post it anywhere');
}

function escapeHtml(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeModal(); });
  document.body.appendChild(overlay);
}

function openAddPropertyModal(){
  const overlay = document.createElement('div');
  overlay.className='modal-overlay';
  overlay.id='modalOverlay';
  overlay.innerHTML = `
  <div class="modal">
    <div class="modal-header"><h2>Add a property</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="field"><label>Title</label><input id="mpTitle" placeholder="e.g. 3/2 house near Lake Nona"/></div>
    <div class="field"><label>Address</label><input id="mpAddress" placeholder="Street, city"/></div>
    <div class="field"><label>Monthly rent</label><input id="mpPrice" type="number" placeholder="1800"/></div>
    <div class="field"><label>Bedrooms</label><input id="mpBeds" type="number" placeholder="3"/></div>
    <button class="btn btn-primary" onclick="submitAddProperty()">Add property</button>
  </div>`;
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeModal(); });
  document.body.appendChild(overlay);
}

function submitAddProperty(){
  const title = document.getElementById('mpTitle').value.trim();
  const address = document.getElementById('mpAddress').value.trim();
  const price = document.getElementById('mpPrice').value;
  const beds = document.getElementById('mpBeds').value;
  if(!title || !price){ showToast('Add a title and rent amount'); return; }
  addProperty({title, address, price, beds});
  closeModal();
}

function openInterestModal(propId){
  const prop = state.publicProperties.find(p=>p.id===propId);
  const overlay = document.createElement('div');
  overlay.className='modal-overlay';
  overlay.id='modalOverlay';
  overlay.innerHTML = `
  <div class="modal public-theme public-modal">
    <div class="modal-header"><div><div class="eyebrow">${escapeHtml(prop.title)}</div><h2>I'm interested</h2></div><button class="modal-close" onclick="closeModal()">✕</button></div>
    <p class="muted" style="margin-bottom:16px;">Takes a minute. We'll only reach out if it's a fit.</p>
    <div class="field"><label>Your name</label><input id="liName" placeholder="Full name"/></div>
    <div class="field"><label>Phone number</label><input id="liPhone" placeholder="(407) 555-0100"/></div>
    <div class="field"><label>Email</label><input id="liEmail" type="email" placeholder="you@email.com"/></div>
    <div class="field"><label>How many people will be living here?</label><input id="liHousehold" type="number" placeholder="3"/></div>
    <div class="field"><label>When are you available to move?</label><input id="liDate" type="date" min="${new Date().toISOString().split('T')[0]}"/></div>
    <div class="field"><label>How much down payment do you have available?</label><input id="liDown" type="number" placeholder="10000"/></div>
    <div class="field"><label>Monthly budget</label><input id="liBudget" type="number" placeholder="1800"/></div>
    <button class="btn btn-primary" onclick="submitInterest('${propId}')">Submit</button>
  </div>`;
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeModal(); });
  document.body.appendChild(overlay);
}

async function submitInterest(propId){
  const name = document.getElementById('liName').value.trim();
  const phone = document.getElementById('liPhone').value.trim();
  const email = document.getElementById('liEmail').value.trim();
  const householdSize = document.getElementById('liHousehold').value;
  const downPayment = document.getElementById('liDown').value;
  const budget = document.getElementById('liBudget').value;
  const moveDate = document.getElementById('liDate').value.trim();
  if(!name || !phone || downPayment===''){ showToast('Name, phone, and down payment are required'); return; }
  const prop = state.publicProperties.find(p=>p.id===propId);
  const ok = await submitLead(state.publicProfile.id, { name, phone, email, householdSize, downPayment, budget, moveDate, propertyTitle: prop ? prop.title : '' });
  if(!ok) return;
  closeModal();
  showConfirmModal();
}

function showConfirmModal(){
  const overlay = document.createElement('div');
  overlay.className='modal-overlay';
  overlay.id='modalOverlay';
  overlay.innerHTML = `
  <div class="modal public-theme public-modal" style="text-align:center; padding-top:36px;">
    <div style="font-size:44px; margin-bottom:10px;">✓</div>
    <h2>You're on the list</h2>
    <p class="muted" style="margin:10px 0 20px;">They'll reach out if it's a good fit. Thanks for sharing your info up front.</p>
    <button class="btn btn-outline-light" onclick="closeModal()">Close</button>
  </div>`;
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeModal(); });
  document.body.appendChild(overlay);
}

function openLeadDetail(id){
  const l = state.leads.find(x=>x.id===id);
  if(!l) return;
  const overlay = document.createElement('div');
  overlay.className='modal-overlay';
  overlay.id='modalOverlay';
  overlay.innerHTML = `
  <div class="modal">
    <div class="modal-header"><div><div class="eyebrow">${l.property_title ? escapeHtml(l.property_title) : 'Lead'}</div><h2>${escapeHtml(l.name)}</h2></div><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="card" style="margin-bottom:14px;">
      <div style="display:flex; justify-content:space-between; padding:6px 0;"><span class="muted">Phone</span><span>${escapeHtml(l.phone||'-')}</span></div>
      <div style="display:flex; justify-content:space-between; padding:6px 0;"><span class="muted">Email</span><span>${escapeHtml(l.email||'-')}</span></div>
      <div style="display:flex; justify-content:space-between; padding:6px 0;"><span class="muted">Down payment</span><span class="mono" style="color:var(--gold); font-weight:700;">${fmtMoney(l.down_payment)}</span></div>
      <div style="display:flex; justify-content:space-between; padding:6px 0;"><span class="muted">Monthly budget</span><span>${fmtMoney(l.budget)}</span></div>
      <div style="display:flex; justify-content:space-between; padding:6px 0;"><span class="muted">Household size</span><span>${escapeHtml(l.household_size||'-')}</span></div>
      <div style="display:flex; justify-content:space-between; padding:6px 0;"><span class="muted">Move-in</span><span>${escapeHtml(l.move_date||'-')}</span></div>
      <div style="display:flex; justify-content:space-between; padding:6px 0;"><span class="muted">Submitted</span><span>${timeAgo(l.created_at)}</span></div>
    </div>
    <label>Status</label>
    <div class="segmented" style="margin-top:6px;">
      <button class="seg-btn ${l.status==='new'?'active':''}" onclick="updateLeadStatus('${l.id}','new'); closeModal();">New</button>
      <button class="seg-btn ${l.status==='qualified'?'active':''}" onclick="updateLeadStatus('${l.id}','qualified'); closeModal();">Qualified</button>
      <button class="seg-btn ${l.status==='scheduled'?'active':''}" onclick="updateLeadStatus('${l.id}','scheduled'); closeModal();">Scheduled</button>
    </div>
    ${l.phone ? `<a class="btn btn-primary" style="margin-top:16px; text-decoration:none;" href="tel:${escapeHtml(l.phone)}">Call ${escapeHtml(l.name.split(' ')[0])}</a>` : ''}
  </div>`;
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeModal(); });
  document.body.appendChild(overlay);
}

function closeModal(){
  const o = document.getElementById('modalOverlay');
  if(o) o.remove();
}

function previewPublic(){
  location.hash = '#/p/' + state.profile.slug;
}

function handleCompleteProfile(){
  const name = document.getElementById('cpName').value.trim();
  const phone = document.getElementById('cpPhone').value.trim();
  if(!name){ showToast('Enter a business name'); return; }
  completeProfile(name, phone);
}

function handleCreate(){
  const name = document.getElementById('obName').value.trim();
  const phone = document.getElementById('obPhone').value.trim();
  const email = document.getElementById('obEmail').value.trim();
  const password = document.getElementById('obPass').value;
  if(!name || !email || !password){ showToast('Name, email, and password are required'); return; }
  if(password.length < 6){ showToast('Password must be at least 6 characters'); return; }
  createProfile(name, phone, email, password);
}
function handleLogin(){
  const email = document.getElementById('liEmail').value.trim();
  const password = document.getElementById('liPass').value;
  if(!email || !password){ showToast('Enter your email and password'); return; }
  loginExisting(email, password);
}

// ---------------- Render shell ----------------
function render(){
  const app = document.getElementById('app');
  closeModal();

  if(state.route === 'onboard'){
    app.className = 'landing-page';
    app.innerHTML = viewLanding();
    return;
  }

  if(state.route === 'complete-profile'){
    app.className = '';
    app.innerHTML = `
      <div class="topbar">
        <div class="brand"><span class="dot"></span>Zunti</div>
        <button class="nav-btn-outline" style="padding:6px 12px;" onclick="logout()">Log out</button>
      </div>
      <main>
        <div class="eyebrow">One more step</div>
        <h1 style="margin-bottom:8px;">Finish your profile</h1>
        <p class="muted" style="margin-bottom:24px;">You're signed in as ${escapeHtml(state.currentUser.email)}. Just need a business name to finish setting up your link.</p>
        <div class="field"><label>Business or your name</label><input id="cpName" placeholder="e.g. Anish Properties"/></div>
        <div class="field"><label>Phone number</label><input id="cpPhone" placeholder="(407) 555-0100"/></div>
        <button class="btn btn-primary" onclick="handleCompleteProfile()">Finish setup</button>
      </main>
    `;
    return;
  }

  if(state.route === 'public'){
    app.className = 'public-theme';
    const isOwnerPreview = state.currentUser && state.profile && state.profile.slug === state.publicSlug;
    app.innerHTML = `
      <div class="topbar">
        <div class="brand" style="color:#221E18;"><span class="dot"></span>Zunti</div>
        ${isOwnerPreview
          ? `<button class="nav-btn-outline" style="border-color:#DCD0BA; color:#221E18; padding:6px 12px;" onclick="location.hash='#/dashboard'">← Back to dashboard</button>`
          : `<div class="topbar-sub" style="color:#8A7F6E;">Powered by Zunti</div>`}
      </div>
      <main>${viewPublic()}</main>
    `;
    return;
  }

  app.className = '';
  let content = '';
  if(state.route==='dashboard') content = viewDashboard();
  else if(state.route==='properties') content = viewProperties();
  else if(state.route==='leads') content = viewLeads();
  else if(state.route==='share') content = viewShare();
  else content = viewDashboard();

  app.innerHTML = `
    <div class="topbar">
      <div class="brand"><span class="dot"></span>Zunti</div>
      <div style="display:flex; align-items:center; gap:14px;">
        <div class="topbar-sub">${state.profile ? '/' + state.profile.slug : ''}</div>
        <button class="nav-btn-outline" style="padding:6px 12px;" onclick="logout()">Log out</button>
      </div>
    </div>
    <main>${content}</main>
    <nav class="bottomnav">
      <button class="navbtn ${state.route==='dashboard'?'active':''}" onclick="location.hash='#/dashboard'">${ICONS.home}<span>Home</span></button>
      <button class="navbtn ${state.route==='properties'?'active':''}" onclick="location.hash='#/properties'">${ICONS.building}<span>Properties</span></button>
      <button class="navbtn ${state.route==='leads'?'active':''}" onclick="location.hash='#/leads'">${ICONS.users}<span>Leads</span></button>
      <button class="navbtn ${state.route==='share'?'active':''}" onclick="location.hash='#/share'">${ICONS.share}<span>Share</span></button>
    </nav>
  `;
}

function bindOnboardSeg(){
  const seg = document.getElementById('onboardSeg');
  if(!seg) return;
  seg.querySelectorAll('.seg-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      seg.querySelectorAll('.seg-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      const which = btn.dataset.seg;
      document.getElementById('onboardNew').style.display = which==='new' ? 'block':'none';
      document.getElementById('onboardExisting').style.display = which==='existing' ? 'block':'none';
    });
  });
}

init();
</script>
</body>
</html>
