<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zunti — Qualify before you drive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0F0E0C;
    --bg-elevated: #17150F;
    --card: #1B1812;
    --line: #2B271D;
    --orange: #FF6A1F;
    --gold: #FF6A1F;
    --cream: #F7F1E8;
    --text: #F0EAE0;
    --text-dim: #A79C8C;
    --text-faint: #695F50;
    --good: #4ADE80;
    --warn: #FF6A1F;
    --danger: #EF4444;
    --radius: 4px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    overflow-x: hidden;
  }
  .display{ font-family: 'Cormorant Garamond', serif; font-weight:600; }
  .mono{ font-family: 'Space Mono', monospace; }

  #app{
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    position: relative;
    display: flex;
    flex-direction: column;
    background: var(--bg);
  }
  #app.landing-page{ max-width: 100%; }

  /* ---------- Public page uses light theme ---------- */
  .public-theme{
    background: var(--cream);
    color: #221E18;
  }
  .public-theme .p-card{
    background: #fff;
    border: 1px solid #E9E0D2;
  }
  .public-theme .p-dim{ color: #8A7F6E; }

  /* ---------- Top bar ---------- */
  .topbar{
    padding: 20px 20px 14px;
    display:flex; align-items:center; justify-content:space-between;
    position: sticky; top:0; z-index: 20;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .public-theme .topbar{ background: var(--cream); border-bottom: 1px solid #E9E0D2; }
  .brand{
    display:flex; align-items:center; gap:9px;
    font-family:'Cormorant Garamond', serif; font-weight:600; font-size:24px; letter-spacing:0.01em;
  }
  .brand .dot{ width:6px; height:6px; border-radius:50%; background:var(--orange); box-shadow: 0 0 10px var(--orange);}
  .topbar-sub{ font-size:11px; color:var(--text-faint); font-family:'Outfit'; letter-spacing:0.04em; }

  main{ flex:1; padding: 18px 18px 100px; }

  /* ---------- Bottom nav ---------- */
  .bottomnav{
    position: sticky; bottom:0; left:0; right:0;
    background: rgba(20,18,15,0.92);
    backdrop-filter: blur(14px);
    border-top: 1px solid var(--line);
    display:flex; justify-content: space-around;
    padding: 10px 8px calc(10px + env(safe-area-inset-bottom));
    z-index: 30;
  }
  .navbtn{
    display:flex; flex-direction:column; align-items:center; gap:4px;
    background:none; border:none; color: var(--text-faint);
    font-family:'Inter'; font-size:10.5px; font-weight:600;
    cursor:pointer; padding:6px 10px; border-radius:12px;
    transition: color .15s ease;
  }
  .navbtn svg{ width:22px; height:22px; }
  .navbtn.active{ color: var(--orange); }
  .navbtn.active svg{ filter: drop-shadow(0 0 6px rgba(255,107,0,0.5)); }

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    font-family:'Outfit'; font-weight:500; font-size:14px; letter-spacing:0.03em;
    border-radius: 2px; border:none; cursor:pointer;
    padding: 15px 20px; width:100%;
    transition: opacity .15s ease;
  }
  .btn:active{ opacity:0.85; }
  .btn-primary{ background: var(--orange); color: #0F0E0C; }
  .btn-primary:hover{ opacity:0.9; }
  .btn-ghost{ background: transparent; color: var(--text); border:1px solid var(--line); }
  .btn-outline-light{ background:transparent; color:#221E18; border:1px solid #221E18; }

  input, textarea, select{
    width:100%; background: transparent; border:none; border-bottom:1px solid var(--line);
    color: var(--text); border-radius:0; padding:12px 2px;
    font-family:'Outfit'; font-weight:300; font-size:16px; outline:none;
  }
  .public-theme input, .public-theme textarea, .public-theme select{
    background:transparent; border-bottom:1px solid #DCD0BA; color:#221E18;
  }
  input:focus, textarea:focus, select:focus{ border-color: var(--orange); }
  label{ font-size:11px; font-weight:500; color:var(--text-faint); display:block; margin-bottom:8px; letter-spacing:0.08em; text-transform:uppercase; }
  .public-theme label{ color:#8A7F6E; }
  .field{ margin-bottom:20px; }

  .card{ background: var(--card); border:1px solid var(--line); border-radius: var(--radius); padding:20px; }

  h1{ font-family:'Cormorant Garamond', serif; font-weight:600; font-size:32px; letter-spacing:0.01em; }
  h2{ font-family:'Cormorant Garamond', serif; font-weight:600; font-size:22px; letter-spacing:0.01em; margin-bottom:4px;}
  .eyebrow{ font-size:10.5px; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; color:var(--orange); margin-bottom:8px;}
  .muted{ color:var(--text-dim); font-size:14px; line-height:1.6; font-weight:300; }
  .public-theme .muted{ color:#8A7F6E; }

  /* Lead rank card - signature element */
  .lead-row{
    display:flex; align-items:center; gap:16px;
    background:transparent; border:none; border-bottom:1px solid var(--line); border-radius:0;
    padding:16px 2px;
  }
  .rank-badge{
    width:30px; height:30px; border-radius:0; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Mono'; font-weight:700; font-size:13px;
    background: var(--bg-elevated); color: var(--text-faint); border:1px solid var(--line);
  }
  .rank-badge.gold{ background: rgba(255,184,0,0.12); color: var(--gold); border-color: rgba(255,184,0,0.3); }
  .lead-info{ flex:1; min-width:0; }
  .lead-name{ font-weight:700; font-size:15px; }
  .lead-meta{ font-size:12px; color:var(--text-faint); margin-top:2px; }
  .lead-amount{ text-align:right; }
  .lead-amount .num{ font-family:'Space Mono'; font-weight:700; font-size:17px; color: var(--gold); }
  .lead-amount .lbl{ font-size:10px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.06em;}

  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px; }
  .stat-card{ background:transparent; border:none; border-bottom:1px solid var(--line); border-radius:0; padding:16px 4px; }
  .stat-num{ font-family:'Space Mono'; font-weight:700; font-size:22px; color:var(--orange); }
  .stat-lbl{ font-size:11.5px; color:var(--text-dim); margin-top:2px; }

  .prop-card{
    background:transparent; border:none; border-bottom:1px solid var(--line); border-radius:0; overflow:hidden; margin-bottom:0; padding-bottom:18px; margin-top:18px;
  }
  .prop-img{ height:120px; background: linear-gradient(135deg, #2A241B, #14120F); display:flex; align-items:center; justify-content:center; color:var(--text-faint); font-size:12px;}
  .prop-body{ padding:14px 16px; }
  .prop-price{ font-family:'Space Mono'; font-weight:700; color:var(--gold); font-size:16px; }

  .public-prop-card{
    background:transparent; border:none; border-bottom:1px solid #E2D8C6; border-radius:0; overflow:hidden; margin-bottom:0; padding-bottom:22px; margin-top:22px;
    cursor:pointer;
  }
  .public-prop-img{ height:150px; background: linear-gradient(135deg, #EDE3D0, #F7F1E8); display:flex; align-items:center; justify-content:center; color:#B8AA92; font-size:12px;}

  .badge{ display:inline-block; padding:4px 10px; border-radius:100px; font-size:11px; font-weight:700; }
  .badge-orange{ background: rgba(255,107,0,0.14); color: var(--orange); }

  .empty{ text-align:center; padding: 50px 20px; color:var(--text-faint); }
  .empty svg{ opacity:0.35; margin-bottom:14px; }

  .fab{
    position: fixed; bottom: 90px; right: 50%; transform: translateX(200px);
    width:52px; height:52px; border-radius:50%; background:var(--orange);
    display:flex; align-items:center; justify-content:center; border:none; cursor:pointer;
    box-shadow: 0 8px 24px rgba(255,107,0,0.4); z-index:25;
  }
  @media (max-width: 560px){ .fab{ right:20px; transform:none; } }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.6); backdrop-filter: blur(4px);
    display:flex; align-items:flex-end; z-index:50;
  }
  .modal{
    background: var(--bg-elevated); width:100%; max-width:480px; margin:0 auto;
    border-radius: 24px 24px 0 0; padding: 22px 20px calc(24px + env(safe-area-inset-bottom));
    max-height: 88vh; overflow-y:auto;
    border-top: 1px solid var(--line);
  }
  .public-theme.modal, .modal.public-modal{ background:#fff; }
  .modal-handle{ width:36px; height:4px; background:var(--line); border-radius:10px; margin: 0 auto 18px; }

  .toast{
    position:fixed; top:16px; left:50%; transform:translateX(-50%);
    background: var(--gold); color:#14120F; font-weight:700; font-size:13.5px;
    padding:12px 20px; border-radius:100px; z-index:100; box-shadow:0 8px 24px rgba(0,0,0,0.3);
    animation: toastIn .25s ease;
  }
  @keyframes toastIn{ from{opacity:0; transform:translate(-50%,-10px);} to{opacity:1; transform:translate(-50%,0);} }

  .link-box{
    display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line);
    border-radius:14px; padding:14px 16px; margin-bottom:14px;
  }
  .link-box .mono{ flex:1; font-size:13px; color:var(--gold); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .copy-btn{ background:var(--orange); color:#0F0E0C; border:none; border-radius:2px; padding:9px 16px; font-weight:500; font-size:11px; letter-spacing:0.05em; text-transform:uppercase; cursor:pointer; flex-shrink:0; font-family:'Outfit'; }

  .progress-track{ height:6px; background:var(--line); border-radius:10px; overflow:hidden; margin-top:8px; }
  .progress-fill{ height:100%; background: linear-gradient(90deg, var(--orange), var(--gold)); border-radius:10px; }

  .segmented{ display:flex; gap:6px; background:var(--bg-elevated); border-radius:12px; padding:4px; margin-bottom:16px; }
  .public-theme .segmented{ background:#EFE6D5; }
  .seg-btn{ flex:1; border:none; background:none; padding:9px; border-radius:9px; font-size:12.5px; font-weight:700; color:var(--text-faint); cursor:pointer; }
  .seg-btn.active{ background:var(--orange); color:#14120F; }

  .hero-public{ text-align:center; padding: 26px 8px 4px; }
  .avatar-circle{
    width:44px; height:44px; border-radius:50%; border:1px solid var(--orange);
    display:flex; align-items:center; justify-content:center; margin:0 auto 16px;
    font-family:'Cormorant Garamond', serif; font-weight:600; font-size:18px; color:var(--orange);
  }

  /* House hero band - dissolves into the black background at the top */
  .house-hero{
    position:relative; width:calc(100% + 36px); height:200px; overflow:hidden;
    margin: -18px -18px 4px;
    background: var(--bg-elevated);
    display:flex; align-items:flex-end; justify-content:center;
  }
  .public-theme .house-hero{ background: #EFE6D5; }
  .house-hero-art{
    width:100%; height:100%; display:flex; align-items:flex-end; justify-content:center;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.5) 30%, black 62%);
    mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.5) 30%, black 62%);
  }
  .house-hero svg{ width:280px; height:auto; opacity:0.95; }
  .house-hero .house-glow{ filter: drop-shadow(0 0 14px rgba(255,106,31,0.3)); }
  .house-hero-caption{
    position:absolute; top:20px; left:0; right:0; text-align:center; z-index:2;
    font-family:'Space Mono'; font-size:9.5px; letter-spacing:0.22em; text-transform:uppercase; color:var(--text-faint);
  }
  .public-theme .house-hero-caption{ color:#B0A489; }

  /* ---------- Landing page (Maeso-style) ---------- */
  .landing-topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding: 18px 24px; border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:20; background:var(--bg);
    gap:10px;
  }
  .landing-logo{
    font-family:'Outfit'; font-weight:400; font-size:15px; letter-spacing:0.35em;
    color:var(--text); text-transform:uppercase;
  }
  .landing-nav{ display:flex; align-items:center; gap:10px; }
  .nav-btn-outline{
    border:1px solid var(--line); background:transparent; color:var(--text-dim);
    font-family:'Outfit'; font-size:10px; letter-spacing:0.1em; text-transform:uppercase;
    padding:12px 18px; cursor:pointer; line-height:1.3; white-space:nowrap;
  }
  .nav-btn-solid{
    border:none; background:var(--cream); color:#0F0E0C;
    font-family:'Outfit'; font-weight:500; font-size:10px; letter-spacing:0.1em; text-transform:uppercase;
    padding:12px 20px; cursor:pointer; white-space:nowrap;
  }

  .landing-hero{
    position:relative; width:100%; height:68vh; min-height:460px; max-height:720px; overflow:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding: 0 20px;
  }
  .landing-hero-bg{ position:absolute; inset:0; z-index:0; }
  .landing-hero-bg svg{ width:100%; height:100%; }
  .landing-hero-vignette{
    position:absolute; inset:0; z-index:1;
    background: radial-gradient(ellipse at 50% 40%, rgba(15,14,12,0.15), rgba(15,14,12,0.9) 78%),
                linear-gradient(180deg, rgba(15,14,12,0.5), rgba(15,14,12,0.95));
  }
  .landing-wordmark{
    position:relative; z-index:2;
    font-family:'Outfit', sans-serif; font-weight:300; text-transform:uppercase;
    font-size: clamp(76px, 22vw, 160px); letter-spacing:0.09em; color:var(--cream); line-height:1;
    text-shadow: 0 0 40px rgba(247,241,232,0.35), 0 0 90px rgba(255,106,31,0.2);
  }
  .landing-tagline{
    position:relative; z-index:2; margin-top:22px;
    font-family:'Outfit'; font-size:clamp(11px,1.1vw,13px); letter-spacing:0.32em; text-transform:uppercase; color:var(--text-dim);
  }

  .tile-grid{
    display:grid; grid-template-columns:repeat(3,1fr);
    border-top:1px solid var(--line); border-left:1px solid var(--line);
    max-width: 1400px; margin: 0 auto;
  }
  .tile{
    border-right:1px solid var(--line); border-bottom:1px solid var(--line);
    padding: 34px 12px; text-align:center;
    display:flex; flex-direction:column; align-items:center; gap:16px;
    cursor:pointer; background:transparent; transition: background .15s ease;
  }
  @media (min-width: 760px){
    .tile-grid{ grid-template-columns:repeat(6,1fr); }
    .tile{ padding: 46px 12px; }
    .tile svg{ width:30px; height:30px; }
    .landing-hero{ padding: 0 40px; }
  }
  .tile:active{ background: var(--bg-elevated); }
  .tile svg{ width:26px; height:26px; color:var(--orange); opacity:0.9; }
  .tile-label{
    font-family:'Outfit'; font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase; color:var(--text-dim);
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
// ---------------- Storage helpers ----------------
async function sGet(key, shared){
  try{ const r = await window.storage.get(key, !!shared); return r ? JSON.parse(r.value) : null; }
  catch(e){ return null; }
}
async function sSet(key, value, shared){
  try{ await window.storage.set(key, JSON.stringify(value), !!shared); return true; }
  catch(e){ console.error('storage set failed', e); return false; }
}

// ---------------- App state ----------------
let state = {
  mySlug: null,       // logged-in landlord slug (personal)
  route: 'loading',
  profile: null,
  properties: [],
  leads: [],
  publicSlug: null,
  publicProperties: [],
  publicProfile: null,
  selectedProperty: null,
  loading: true,
};

function slugify(s){
  return s.toLowerCase().trim().replace(/[^a-z0-9]+/g,'').slice(0,20) || 'user'+Math.floor(Math.random()*9999);
}
function fmtMoney(n){
  n = Number(n)||0;
  return '$' + n.toLocaleString('en-US');
}
function timeAgo(ts){
  const diff = Date.now() - ts;
  const mins = Math.floor(diff/60000);
  if(mins < 1) return 'just now';
  if(mins < 60) return mins+'m ago';
  const hrs = Math.floor(mins/60);
  if(hrs < 24) return hrs+'h ago';
  return Math.floor(hrs/24)+'d ago';
}

// ---------------- Routing ----------------
function parseHash(){
  const h = location.hash.replace('#','') || '/dashboard';
  const parts = h.split('/').filter(Boolean);
  return parts;
}

async function route(){
  const parts = parseHash();
  if(parts[0] === 'p' && parts[1]){
    state.route = 'public';
    state.publicSlug = parts[1];
    state.selectedPropertyId = parts[3] || null;
    await loadPublic(parts[1]);
    render();
    return;
  }
  // private area needs login
  if(!state.mySlug){
    state.route = 'onboard';
    render();
    return;
  }
  state.route = parts[0] || 'dashboard';
  await loadPrivate();
  render();
}

async function loadPrivate(){
  state.profile = await sGet('profile:'+state.mySlug, true);
  state.properties = (await sGet('properties:'+state.mySlug, true)) || [];
  state.leads = (await sGet('leads:'+state.mySlug, true)) || [];
  state.leads.sort((a,b)=> (b.downPayment||0) - (a.downPayment||0));
}

async function loadPublic(slug){
  state.publicProfile = await sGet('profile:'+slug, true);
  state.publicProperties = (await sGet('properties:'+slug, true)) || [];
}

// ---------------- Init ----------------
async function init(){
  const my = await sGet('my-slug', false);
  state.mySlug = my ? my.slug : null;
  window.addEventListener('hashchange', route);
  await route();
}

// ---------------- Actions ----------------
async function createProfile(businessName, phone){
  let slug = slugify(businessName);
  // ensure some uniqueness
  const existing = await sGet('profile:'+slug, true);
  if(existing) slug = slug + Math.floor(Math.random()*90+10);
  const profile = { slug, businessName, phone, createdAt: Date.now() };
  await sSet('profile:'+slug, profile, true);
  await sSet('properties:'+slug, [], true);
  await sSet('leads:'+slug, [], true);
  await sSet('my-slug', {slug}, false);
  state.mySlug = slug;
  location.hash = '#/dashboard';
  await route();
}

async function loginExisting(slug){
  slug = slugify(slug);
  const p = await sGet('profile:'+slug, true);
  if(!p){ showToast("Can't find that link — check the spelling", true); return; }
  await sSet('my-slug', {slug}, false);
  state.mySlug = slug;
  location.hash = '#/dashboard';
  await route();
}

async function addProperty(data){
  const prop = { id: 'pr'+Date.now(), ...data, createdAt: Date.now() };
  const list = [prop, ...state.properties];
  await sSet('properties:'+state.mySlug, list, true);
  state.properties = list;
  render();
  showToast('Property added');
}

async function deleteProperty(id){
  const list = state.properties.filter(p=>p.id!==id);
  await sSet('properties:'+state.mySlug, list, true);
  state.properties = list;
  render();
}

async function submitLead(slug, data){
  const leads = (await sGet('leads:'+slug, true)) || [];
  const lead = { id:'ld'+Date.now(), ...data, createdAt: Date.now(), status:'new' };
  leads.unshift(lead);
  await sSet('leads:'+slug, leads, true);
  return true;
}

async function updateLeadStatus(id, status){
  const list = state.leads.map(l => l.id===id ? {...l, status} : l);
  await sSet('leads:'+state.mySlug, list, true);
  state.leads = list;
  render();
}

let toastTimer;
function showToast(msg){
  let t = document.getElementById('toast');
  if(t) t.remove();
  t = document.createElement('div');
  t.id='toast'; t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.remove(), 2200);
}

function copyLink(){
  const link = location.origin + location.pathname + '#/p/' + state.mySlug;
  navigator.clipboard?.writeText(link).catch(()=>{});
  showToast('Link copied — post it anywhere');
}

// ---------------- House hero art ----------------
function houseHero(caption){
  return `
  <div class="house-hero">
    <div class="house-hero-caption">${caption || ''}</div>
    <div class="house-hero-art">
    <svg class="house-glow" viewBox="0 0 220 130" fill="none" xmlns="http://www.w3.org/2000/svg">
      <line x1="0" y1="118" x2="220" y2="118" stroke="var(--orange)" stroke-width="0.75" opacity="0.4"/>
      <path d="M20 118V70L60 40L100 70V118" stroke="var(--orange)" stroke-width="1.4" opacity="0.65"/>
      <rect x="30" y="86" width="14" height="32" stroke="var(--orange)" stroke-width="1.1" opacity="0.6"/>
      <rect x="76" y="86" width="16" height="18" stroke="var(--orange)" stroke-width="1.1" opacity="0.6"/>
      <path d="M120 118V56L172 22L220 56V118" stroke="var(--orange)" stroke-width="1.6" opacity="0.95"/>
      <rect x="136" y="80" width="18" height="38" stroke="var(--orange)" stroke-width="1.3" opacity="0.95"/>
      <rect x="188" y="76" width="18" height="20" stroke="var(--orange)" stroke-width="1.3" opacity="0.95"/>
      <rect x="188" y="102" width="18" height="16" stroke="var(--orange)" stroke-width="1.3" opacity="0.95"/>
      <line x1="172" y1="22" x2="172" y2="8" stroke="var(--orange)" stroke-width="1.3" opacity="0.95"/>

function escapeHtml(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

}
function handleLogin(){
  const slug = document.getElementById('obSlug').value.trim();
  if(!slug){ showToast('Enter your link ID'); return; }
  loginExisting(slug);
}

// ---------------- Render shell ----------------
function render(){
  const app = document.getElementById('app');
  closeModal();

  if(state.route === 'onboard'){
    app.className = 'landing-page';
    app.innerHTML = viewLanding();
    return;
  }

  if(state.route === 'public'){
    app.className = 'public-theme';
    app.innerHTML = `
      <div class="topbar">
        <div class="brand" style="color:#221E18;"><span class="dot"></span>Zunti</div>
        <div class="topbar-sub" style="color:#8A7F6E;">Powered by Zunti</div>
      </div>
      <main>${viewPublic()}</main>
    `;
    return;
  }

  app.className = '';
  let content = '';
  if(state.route==='dashboard') content = viewDashboard();
  else if(state.route==='properties') content = viewProperties();
  else if(state.route==='leads') content = viewLeads();
  else if(state.route==='share') content = viewShare();
  else content = viewDashboard();

  app.innerHTML = `
    <div class="topbar">
      <div class="brand"><span class="dot"></span>Zunti</div>
      <div class="topbar-sub">${state.profile ? '/' + state.profile.slug : ''}</div>
    </div>
    <main>${content}</main>
    <nav class="bottomnav">
      <button class="navbtn ${state.route==='dashboard'?'active':''}" onclick="location.hash='#/dashboard'">${ICONS.home}Home</button>
      <button class="navbtn ${state.route==='properties'?'active':''}" onclick="location.hash='#/properties'">${ICONS.building}Properties</button>
      <button class="navbtn ${state.route==='leads'?'active':''}" onclick="location.hash='#/leads'">${ICONS.users}Leads</button>
      <button class="navbtn ${state.route==='share'?'active':''}" onclick="location.hash='#/share'">${ICONS.share}Share</button>
    </nav>
  `;
}

function bindOnboardSeg(){
  const seg = document.getElementById('onboardSeg');
  if(!seg) return;
  seg.querySelectorAll('.seg-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      seg.querySelectorAll('.seg-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      const which = btn.dataset.seg;
      document.getElementById('onboardNew').style.display = which==='new' ? 'block':'none';
      document.getElementById('onboardExisting').style.display = which==='existing' ? 'block':'none';
    });
  });
}

init();
</script>
</body>
</html>
